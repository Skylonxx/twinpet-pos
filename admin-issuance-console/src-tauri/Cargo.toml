[package]
name = "issuer_console"
version = "1.0.0"
description = "Twinpet SEC-001 Packet C-A Admin Issuance Console"
authors = ["Twinpet"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "issuer_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8"
windows = { version = "0.61.3", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
